<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
  </head>
  <body>
      <button id="up">Up</button>
      <button id="down">Down</button>
      <button id="forward">Forward</button>
      <button id="back">Back</button>
      <button id="left">Left</button>
      <button id="right">Right</button>
    

      <div/>

      <button id="detect">forward</button>
      <button id="detect_up">up</button>
      <button id="detect_down">down</button>
  </body>
  <script>
  const up = document.getElementById("up");
  const down= document.getElementById("down");
  const forward= document.getElementById("forward");
  const back= document.getElementById("back");
  const left= document.getElementById("left");
  const right= document.getElementById("right");

  const detect = document.getElementById("detect");
  const detect_up= document.getElementById("detect_up");
  const detect_down= document.getElementById("detect_down");


  // MOVE

  const MOVE_ENDPOINT = "/move";

  up.addEventListener("click", () => {
    fetch(MOVE_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ direction: "up", distance: 1 })
    });
  });
  down.addEventListener("click", () => {
    fetch(MOVE_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ direction: "down", distance: 1 })
    });
  });
  forward.addEventListener("click", () => {
    fetch(MOVE_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ direction: "forward", distance: 1 })
    });
  });
  back.addEventListener("click", () => {
    fetch(MOVE_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ direction: "back", distance: 1 })
    });
  });
  left.addEventListener("click", () => {
    fetch(MOVE_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ direction: "left", distance: 1 })
    });
  });
  right.addEventListener("click", () => {
    fetch(MOVE_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ direction: "right", distance: 1 })
    });
  });




  // DETECT

  DETECT_ENDPOINT = "/detect";

  detect.addEventListener("click", () => {
    fetch(DETECT_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ direction: "front" })
    });
  }).then(response => print(response.json()))

  detect.addEventListener("click", () => {
    fetch(DETECT_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ direction: "up" })
    });
  }).then(response => print(response.json()))

  detect.addEventListener("click", () => {
    fetch(DETECT_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ direction: "down" })
    });
  }).then(response => print(response.json()))

  </script>

</html>
