name: Deploy to NAS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          cd /app
          git pull
          KEY_TRIMMED=$(echo "$OPENCODE_API_KEY" | xargs)
          echo "OPENCODE_API_KEY=$KEY_TRIMMED" > /app/.env
          docker compose down
          docker compose up -d --build
