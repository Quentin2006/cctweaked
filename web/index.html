<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Turtle Control</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---- CSS Variables / Design Tokens ---- */
      :root {
        --bg-deep: #0c111a;
        --bg-surface: #121a26;
        --bg-elevated: #1a2636;
        --bg-hover: #243244;
        --border-subtle: #243244;
        --border-accent: #2a3d52;

        --accent-primary: #00f0b0;
        --accent-primary-dim: #009e75;
        --accent-secondary: #00d4ff;
        --accent-danger: #ff3355;
        --accent-success: #2ed573;
        --accent-warning: #ffb347;
        --accent-detect: #ff7eb3;

        --text-primary: #e8edf5;
        --text-secondary: #7a8ba0;
        --text-dim: #4a5a6e;

        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --radius-xl: 20px;

        --shadow-btn: 0 4px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        --shadow-elevated: 0 8px 32px rgba(0, 0, 0, 0.5);

        --font-display: "Orbitron", sans-serif;
        --font-body: "DM Sans", sans-serif;
        --font-mono: "JetBrains Mono", monospace;

        --transition-fast: 120ms ease;
        --transition-med: 200ms ease;
      }

      /* ---- Reset & Base ---- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-body);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: radial-gradient(
            ellipse 80% 60% at 50% -20%,
            rgba(0, 240, 176, 0.04) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse 60% 50% at 30% 120%,
            rgba(0, 212, 255, 0.03) 0%,
            transparent 60%
          );
      }

      /* ---- Main Container ---- */
      .container {
        width: 100%;
        max-width: 820px;
        padding: 24px;
        margin: 24px;
      }

      /* ---- Header ---- */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .header-title {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .header-title h1 {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 1.5rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .header-icon {
        width: 32px;
        height: 32px;
        fill: var(--accent-primary);
        flex-shrink: 0;
      }

      /* ---- Connection Status ---- */
      .connection-status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        padding: 6px 14px;
        border-radius: var(--radius-xl);
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-dim);
        transition: background var(--transition-med);
        flex-shrink: 0;
      }

      .status-dot.connected {
        background: var(--accent-success);
        box-shadow: 0 0 8px rgba(46, 213, 115, 0.5);
      }

      .status-dot.disconnected {
        background: var(--accent-danger);
        box-shadow: 0 0 8px rgba(255, 51, 85, 0.5);
      }

      .status-text {
        color: var(--text-secondary);
        transition: color var(--transition-med);
      }

      .status-text.connected {
        color: var(--accent-success);
      }

      .status-text.disconnected {
        color: var(--accent-danger);
      }

      /* ---- Control Panel Layout ---- */
      .control-panel {
        display: flex;
        gap: 32px;
        align-items: flex-start;
        justify-content: center;
        flex-wrap: wrap;
      }

      /* ---- D-Pad Section ---- */
      .dpad-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .dpad-section .section-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-dim);
        font-weight: 500;
        margin-bottom: 2px;
      }

      .dpad-grid {
        display: grid;
        grid-template-columns: repeat(3, 72px);
        grid-template-rows: repeat(3, 72px);
        gap: 6px;
      }

      .dpad-btn {
        position: relative;
        border: none;
        border-radius: var(--radius-md);
        font-family: var(--font-body);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: transform var(--transition-fast), box-shadow var(--transition-fast),
          background var(--transition-med);
        box-shadow: var(--shadow-btn);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        -webkit-user-select: none;
        user-select: none;
      }

      .dpad-btn .arrow {
        font-size: 1.3rem;
        line-height: 1;
      }

      .dpad-btn .label {
        font-size: 0.55rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        opacity: 0.7;
      }

      /* Directional buttons — dark surface */
      .dpad-btn.direction {
        background: linear-gradient(145deg, #1a2636, #141d2b);
        color: var(--text-primary);
        border: 1px solid var(--border-accent);
      }

      .dpad-btn.direction:hover {
        background: linear-gradient(145deg, #243244, #1a2636);
        border-color: var(--accent-primary-dim);
        transform: translateY(-1px);
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .dpad-btn.direction:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      /* Center button — accent */
      .dpad-btn.center-btn {
        background: linear-gradient(145deg, var(--accent-primary), #00c99a);
        color: #061014;
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 0.85rem;
      }

      .dpad-btn.center-btn:hover {
        background: linear-gradient(145deg, #00ffc2, var(--accent-primary));
        transform: translateY(-1px);
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 240, 176, 0.2);
      }

      .dpad-btn.center-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
      }

      /* Grid positions */
      .dpad-up {
        grid-column: 2;
        grid-row: 1;
      }
      .dpad-left {
        grid-column: 1;
        grid-row: 2;
      }
      .dpad-center {
        grid-column: 2;
        grid-row: 2;
      }
      .dpad-right {
        grid-column: 3;
        grid-row: 2;
      }
      .dpad-down {
        grid-column: 2;
        grid-row: 3;
      }

      /* Back button */
      .btn-back {
        width: 100%;
        max-width: 180px;
        padding: 10px 20px;
        border: none;
        border-radius: var(--radius-md);
        font-family: var(--font-body);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: transform var(--transition-fast), box-shadow var(--transition-fast),
          background var(--transition-med);
        box-shadow: var(--shadow-btn);
        background: linear-gradient(145deg, #2a1a22, #1f131a);
        color: var(--accent-danger);
        border: 1px solid rgba(255, 51, 85, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-back:hover {
        background: linear-gradient(145deg, #3a1f2a, #2a1a22);
        border-color: rgba(255, 51, 85, 0.4);
        transform: translateY(-1px);
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.4);
      }

      .btn-back:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
      }

      /* ---- Detect Section ---- */
      .detect-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding-top: 4px;
      }

      .detect-section .section-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-dim);
        font-weight: 500;
        margin-bottom: 2px;
      }

      .detect-grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
      }

      .detect-btn {
        padding: 12px 24px;
        border: none;
        border-radius: var(--radius-md);
        font-family: var(--font-body);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform var(--transition-fast), box-shadow var(--transition-fast),
          background var(--transition-med);
        box-shadow: var(--shadow-btn);
        background: linear-gradient(145deg, #1e1528, #160f1e);
        color: var(--accent-detect);
        border: 1px solid rgba(255, 126, 179, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 120px;
      }

      .detect-btn:hover {
        background: linear-gradient(145deg, #2e1d3a, #1e1528);
        border-color: rgba(255, 126, 179, 0.35);
        transform: translateY(-1px);
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.4), 0 0 16px rgba(255, 126, 179, 0.08);
      }

      .detect-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
      }

      .detect-btn .icon {
        font-size: 1rem;
      }

      /* ---- Visual Feedback Flash ---- */
      .flash-success {
        animation: flash-success 0.45s ease !important;
      }

      .flash-error {
        animation: flash-error 0.45s ease !important;
      }

      @keyframes flash-success {
        0% {
          box-shadow: var(--shadow-btn), inset 0 0 0 0 rgba(46, 213, 115, 0);
        }
        30% {
          box-shadow: 0 0 24px rgba(46, 213, 115, 0.4), inset 0 0 20px rgba(46, 213, 115, 0.15);
        }
        100% {
          box-shadow: var(--shadow-btn), inset 0 0 0 0 rgba(46, 213, 115, 0);
        }
      }

      @keyframes flash-error {
        0% {
          box-shadow: var(--shadow-btn), inset 0 0 0 0 rgba(255, 51, 85, 0);
        }
        30% {
          box-shadow: 0 0 24px rgba(255, 51, 85, 0.4), inset 0 0 20px rgba(255, 51, 85, 0.15);
        }
        100% {
          box-shadow: var(--shadow-btn), inset 0 0 0 0 rgba(255, 51, 85, 0);
        }
      }

      /* ---- Response Display ---- */
      .response-panel {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--border-subtle);
      }

      .response-panel .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .response-panel .panel-title {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-secondary);
      }

      .response-log {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 16px 18px;
        min-height: 100px;
        max-height: 200px;
        overflow-y: auto;
        font-family: var(--font-mono);
        font-size: 0.78rem;
        line-height: 1.7;
        position: relative;
      }

      .response-log::-webkit-scrollbar {
        width: 4px;
      }

      .response-log::-webkit-scrollbar-track {
        background: transparent;
      }

      .response-log::-webkit-scrollbar-thumb {
        background: var(--border-accent);
        border-radius: 2px;
      }

      .log-entry {
        display: flex;
        gap: 12px;
        padding: 2px 0;
        opacity: 0;
        animation: log-fadein 0.25s ease forwards;
      }

      .log-entry + .log-entry {
        border-top: 1px solid rgba(42, 61, 82, 0.4);
        margin-top: 4px;
        padding-top: 6px;
      }

      @keyframes log-fadein {
        to {
          opacity: 1;
        }
      }

      .log-timestamp {
        color: var(--text-dim);
        flex-shrink: 0;
        font-size: 0.65rem;
        padding-top: 2px;
      }

      .log-body {
        flex: 1;
        min-width: 0;
      }

      .log-cmd {
        color: var(--accent-secondary);
        word-break: break-all;
      }

      .log-resp {
        color: var(--accent-success);
        word-break: break-all;
      }

      .log-resp.error {
        color: var(--accent-danger);
      }

      .log-resp.detect {
        color: var(--accent-detect);
      }

      .log-empty {
        color: var(--text-dim);
        font-style: italic;
        font-size: 0.7rem;
      }

      /* ---- Clear log button ---- */
      .btn-clear-log {
        background: none;
        border: 1px solid var(--border-subtle);
        color: var(--text-dim);
        font-family: var(--font-body);
        font-size: 0.65rem;
        padding: 4px 12px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: color var(--transition-fast), border-color var(--transition-fast);
      }

      .btn-clear-log:hover {
        color: var(--text-secondary);
        border-color: var(--border-accent);
      }

      /* ---- Responsive ---- */
      @media (max-width: 640px) {
        .container {
          padding: 16px;
          margin: 12px;
        }

        .header-title h1 {
          font-size: 1.1rem;
        }

        .control-panel {
          gap: 24px;
        }

        .dpad-grid {
          grid-template-columns: repeat(3, 60px);
          grid-template-rows: repeat(3, 60px);
        }

        .detect-btn {
          min-width: 100px;
          padding: 10px 18px;
        }

        .response-log {
          min-height: 80px;
          max-height: 160px;
          font-size: 0.72rem;
          padding: 12px 14px;
        }
      }

      /* ---- Action Panel ---- */
      .action-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--border-subtle);
      }

      .action-panel .section-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-dim);
        font-weight: 500;
      }

      .action-row {
        display: flex;
        gap: 8px;
      }

      .action-btn {
        padding: 10px 22px;
        border: none;
        border-radius: var(--radius-md);
        font-family: var(--font-body);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform var(--transition-fast), box-shadow var(--transition-fast),
          background var(--transition-med);
        box-shadow: var(--shadow-btn);
        background: linear-gradient(145deg, #1e2822, #151d19);
        color: var(--accent-primary);
        border: 1px solid rgba(0, 240, 176, 0.15);
      }

      .action-btn:hover {
        background: linear-gradient(145deg, #2a3d32, #1e2822);
        border-color: rgba(0, 240, 176, 0.35);
        transform: translateY(-1px);
      }

      .action-btn:active {
        transform: translateY(2px);
      }

      .direction-selector {
        display: flex;
        gap: 6px;
      }

      .dir-btn {
        padding: 5px 16px;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-xl);
        background: var(--bg-surface);
        color: var(--text-secondary);
        font-family: var(--font-body);
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: all var(--transition-fast);
      }

      .dir-btn:hover {
        border-color: var(--accent-primary-dim);
        color: var(--text-primary);
      }

      .dir-btn.active {
        background: var(--accent-primary);
        border-color: var(--accent-primary);
        color: #061014;
      }

      /* ---- Inventory Panel ---- */
      .inventory-panel {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--border-subtle);
      }

      .inventory-panel .section-label {
        display: block;
        text-align: center;
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-dim);
        font-weight: 500;
        margin-bottom: 14px;
      }

      .inventory-layout {
        display: flex;
        gap: 24px;
        align-items: flex-start;
        justify-content: center;
        flex-wrap: wrap;
      }

      .inventory-grid {
        display: grid;
        grid-template-columns: repeat(4, 72px);
        grid-template-rows: repeat(4, 62px);
        gap: 4px;
      }

      .slot {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: var(--font-mono);
        font-size: 0.6rem;
        color: var(--text-secondary);
        cursor: pointer;
        transition: border-color var(--transition-fast), background var(--transition-fast);
        position: relative;
        min-width: 0;
        overflow: hidden;
        padding: 2px;
      }

      .slot:hover {
        border-color: var(--border-accent);
        background: var(--bg-hover);
      }

      .slot.slot-selected {
        border-color: var(--accent-primary);
        box-shadow: 0 0 10px rgba(0, 240, 176, 0.2);
      }

      .slot.slot-filled {
        color: var(--text-primary);
      }

      .slot .slot-name {
        font-size: 0.55rem;
        text-align: center;
        word-break: break-all;
        line-height: 1.2;
        max-width: 100%;
      }

      .slot .slot-count {
        font-size: 0.5rem;
        color: var(--text-dim);
        position: absolute;
        bottom: 2px;
        right: 4px;
      }

      .slot .slot-num {
        font-size: 0.45rem;
        color: var(--text-dim);
        position: absolute;
        top: 2px;
        left: 4px;
        opacity: 0.5;
      }

      /* Crafting section */
      .crafting-section {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .crafting-grid {
        display: grid;
        grid-template-columns: repeat(2, 52px);
        grid-template-rows: repeat(2, 52px);
        gap: 3px;
      }

      .crafting-grid .slot {
        width: 52px;
        height: 52px;
      }

      .craft-arrow {
        font-size: 1.5rem;
        color: var(--text-dim);
        font-family: var(--font-body);
      }

      .craft-result-slot {
        width: 52px;
        height: 52px;
        font-size: 0.7rem;
        color: var(--text-dim);
      }

      .craft-btn {
        display: block;
        margin: 14px auto 0;
        padding: 8px 28px;
        border: none;
        border-radius: var(--radius-md);
        font-family: var(--font-body);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform var(--transition-fast), box-shadow var(--transition-fast),
          background var(--transition-med);
        box-shadow: var(--shadow-btn);
        background: linear-gradient(145deg, #1e1530, #150d24);
        color: #b388ff;
        border: 1px solid rgba(179, 136, 255, 0.15);
      }

      .craft-btn:hover {
        background: linear-gradient(145deg, #2e1d4a, #1e1530);
        border-color: rgba(179, 136, 255, 0.35);
        transform: translateY(-1px);
      }

      .craft-btn:active {
        transform: translateY(2px);
      }

      /* Fuel gauge */
      .fuel-gauge {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        padding: 8px 14px;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
      }

      .fuel-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-secondary);
        font-weight: 600;
        flex-shrink: 0;
      }

      .fuel-bar-track {
        flex: 1;
        height: 8px;
        background: var(--bg-deep);
        border-radius: 4px;
        overflow: hidden;
      }

      .fuel-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent-warning), var(--accent-primary));
        border-radius: 4px;
        transition: width var(--transition-med);
      }

      .fuel-text {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--text-secondary);
        flex-shrink: 0;
        min-width: 50px;
        text-align: right;
      }

      /* Responsive for inventory */
      @media (max-width: 640px) {
        .inventory-grid {
          grid-template-columns: repeat(4, 56px);
          grid-template-rows: repeat(4, 50px);
        }

        .crafting-grid {
          grid-template-columns: repeat(2, 44px);
          grid-template-rows: repeat(2, 44px);
        }

        .crafting-grid .slot,
        .craft-result-slot {
          width: 44px;
          height: 44px;
        }

        .inventory-layout {
          gap: 16px;
        }
      }

      /* ---- 3D Viz Panel ---- */
      .viz-panel {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--border-subtle);
      }

      .viz-panel .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .viz-panel .panel-title {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-secondary);
      }

      .viz-container {
        width: 100%;
        height: 400px;
        background: var(--bg-deep);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        overflow: hidden;
        position: relative;
      }

      .viz-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      @media (max-width: 640px) {
        .viz-container {
          height: 300px;
        }
      }

      @media (max-width: 420px) {
        .dpad-grid {
          grid-template-columns: repeat(3, 52px);
          grid-template-rows: repeat(3, 52px);
          gap: 4px;
        }

        .dpad-btn {
          font-size: 0.65rem;
        }

        .dpad-btn .arrow {
          font-size: 1.1rem;
        }

        .detect-btn {
          min-width: 80px;
          padding: 8px 14px;
          font-size: 0.65rem;
        }

        .header-title h1 {
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="header-title">
          <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a8 8 0 0 0-8 8c0 4 3 7 8 11 5-4 8-7 8-11a8 8 0 0 0-8-8z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <h1>Turtle Control</h1>
        </div>
        <div class="connection-status" id="connection-status">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="status-text">Checking…</span>
        </div>
      </header>

      <!-- Controls -->
      <div class="control-panel">
        <!-- D-Pad -->
        <div class="dpad-section">
          <span class="section-label">Movement</span>
          <div class="dpad-grid">
            <button class="dpad-btn direction dpad-up" data-direction="up">
              <span class="arrow">↑</span>
              <span class="label">Up</span>
            </button>
            <button class="dpad-btn direction dpad-left" data-direction="left">
              <span class="arrow">←</span>
              <span class="label">Left</span>
            </button>
            <button class="dpad-btn center-btn dpad-center" data-direction="forward">
              <span>Fwd</span>
            </button>
            <button class="dpad-btn direction dpad-right" data-direction="right">
              <span class="arrow">→</span>
              <span class="label">Right</span>
            </button>
            <button class="dpad-btn direction dpad-down" data-direction="down">
              <span class="arrow">↓</span>
              <span class="label">Down</span>
            </button>
          </div>
          <button class="btn-back" data-direction="back">
            <span>←</span>
            <span>Back</span>
          </button>
        </div>

        <!-- Detect -->
        <div class="detect-section">
          <span class="section-label">Detect</span>
          <div class="detect-grid">
            <button class="detect-btn" data-detect="forward">
              <span class="icon">▦</span>
              <span>Forward</span>
            </button>
            <button class="detect-btn" data-detect="up">
              <span class="icon">▦</span>
              <span>Up</span>
            </button>
            <button class="detect-btn" data-detect="down">
              <span class="icon">▦</span>
              <span>Down</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="action-panel">
        <span class="section-label">Actions</span>
        <div class="action-row">
          <button class="action-btn" data-action="dig">Dig</button>
          <button class="action-btn" data-action="place">Place</button>
          <button class="action-btn" data-action="attack">Attack</button>
        </div>
        <div class="direction-selector">
          <button class="dir-btn active" data-dir="forward">Front</button>
          <button class="dir-btn" data-dir="up">Up</button>
          <button class="dir-btn" data-dir="down">Down</button>
        </div>
      </div>

      <!-- Inventory -->
      <div class="inventory-panel">
        <span class="section-label">Inventory</span>
        <div class="inventory-layout">
          <div class="inventory-grid" id="inventory-grid"></div>
          <div class="crafting-section">
            <div class="crafting-grid" id="crafting-grid">
              <div class="slot" data-slot="1"></div>
              <div class="slot" data-slot="2"></div>
              <div class="slot" data-slot="3"></div>
              <div class="slot" data-slot="4"></div>
            </div>
            <div class="craft-arrow">→</div>
            <div class="slot craft-result-slot" id="craft-result">?</div>
          </div>
        </div>
        <button class="craft-btn" id="craft-btn">Craft</button>
        <div class="fuel-gauge">
          <span class="fuel-label">Fuel</span>
          <div class="fuel-bar-track">
            <div class="fuel-bar-fill" id="fuel-fill"></div>
          </div>
          <span class="fuel-text" id="fuel-text">-- / --</span>
        </div>
      </div>

      <!-- 3D World -->
      <div class="viz-panel">
        <div class="panel-header">
          <span class="panel-title">// 3D World</span>
        </div>
        <div class="viz-container" id="viz-container"></div>
      </div>

      <!-- Response Log -->
      <div class="response-panel">
        <div class="panel-header">
          <span class="panel-title">// Command Log</span>
          <button class="btn-clear-log" id="clear-log">Clear</button>
        </div>
        <div class="response-log" id="response-log">
          <span class="log-empty">Awaiting command…</span>
        </div>
      </div>
    </div>

    <script>
      // ---- Shared Utilities ----

      /** Display a command + result entry in the response log. */
      window.displayResult = function (cmdLabel, result, type) {
        const log = document.getElementById("response-log");

        // Remove empty placeholder
        const empty = log.querySelector(".log-empty");
        if (empty) empty.remove();

        const now = new Date();
        const ts =
          now.getHours().toString().padStart(2, "0") +
          ":" +
          now.getMinutes().toString().padStart(2, "0") +
          ":" +
          now.getSeconds().toString().padStart(2, "0");

        let respClass = "log-resp";
        const isError = result && (result.error || (typeof result === "object" && result.error));
        if (isError) respClass += " error";
        else if (type === "detect") respClass += " detect";

        const resultStr =
          typeof result === "object" ? JSON.stringify(result, null, 1) : String(result);

        const entry = document.createElement("div");
        entry.className = "log-entry";
        entry.innerHTML =
          '<span class="log-timestamp">[' +
          ts +
          "]</span>" +
          '<div class="log-body">' +
          '<div class="log-cmd">▸ ' +
          escapeHtml(cmdLabel) +
          "</div>" +
          '<div class="' +
          respClass +
          '">◂ ' +
          escapeHtml(resultStr) +
          "</div>" +
          "</div>";

        log.appendChild(entry);
        log.scrollTop = log.scrollHeight;
      };

      /** Flash a button element with success or error color. */
      window.flashButton = function (btn, success) {
        if (!btn) return;
        btn.classList.remove("flash-success", "flash-error");
        // Force reflow
        void btn.offsetWidth;
        btn.classList.add(success ? "flash-success" : "flash-error");
        setTimeout(function () {
          btn.classList.remove("flash-success", "flash-error");
        }, 500);
      };

      function escapeHtml(str) {
        if (typeof str !== "string") return str;
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // ---- Connection Status ----
      (function checkConnection() {
        const dot = document.getElementById("status-dot");
        const text = document.getElementById("status-text");

        fetch("/move", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ direction: "forward", distance: 0 }) })
          .then(function (r) {
            if (r.ok || r.status === 400) {
              // 400 means server is alive but rejected our fake command — good enough
              dot.className = "status-dot connected";
              text.textContent = "Connected";
              text.className = "status-text connected";
            } else {
              throw new Error("unexpected status");
            }
          })
          .catch(function () {
            dot.className = "status-dot disconnected";
            text.textContent = "Disconnected";
            text.className = "status-text disconnected";
          });
      })();

      // ---- Clear Log ----
      document.getElementById("clear-log").addEventListener("click", function () {
        const log = document.getElementById("response-log");
        log.innerHTML = '<span class="log-empty">Awaiting command…</span>';
      });
    </script>
    <script src="move.js"></script>
    <script src="detect.js"></script>
    <script src="action.js"></script>
    <script type="module" src="visualize.js"></script>
    <script type="module" src="inventory.js"></script>
  </body>
</html>
